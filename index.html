<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Dark Realm</title>
    <link rel="icon" type="image/png" href="./src/assets/app/favicon.png" />
    <link rel="apple-touch-icon" href="./src/assets/app/app-icon.png" />
    <meta name="description" content="Пиксельная карточная дуэль покровителей в тёмном фэнтези-мире. Игра против бота или по сети." />
    <!-- the loading screen is styled here, so it shows before the game's code and styles arrive (src/ui/loading.ts) -->
    <style>
      html,
      body {
        margin: 0;
        background: #040906;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 16px;
        overflow: hidden;
        color: #e3ecdf;
        font-family: 'Alegreya SC', Georgia, serif;
        background:
          radial-gradient(ellipse at 50% 42%, #12351f 0%, transparent 60%),
          radial-gradient(ellipse at 50% 115%, #0e2a19 0%, transparent 55%),
          #040906;
        transition: opacity 0.4s ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot img {
        width: min(70vw, 40vh, 320px);
        height: auto;
        border-radius: 22%;
        box-shadow: 0 0 0 1px #3f8a5c99, 0 10px 30px #000d;
        filter: drop-shadow(0 0 24px #4fd17a40);
        animation: boot-breathe 3.2s ease-in-out infinite;
      }
      #boot .boot-bar {
        position: relative;
        width: min(72vw, 300px);
        height: 10px;
        border: 1px solid #3f8a5c;
        border-radius: 6px;
        background: #0b1510;
        box-shadow: inset 0 1px 3px #000c, 0 0 12px #000;
        overflow: hidden;
      }
      #boot-fill {
        display: block;
        width: 0;
        height: 100%;
        border-radius: 5px;
        background: linear-gradient(90deg, #1f6b3d, #4fd17a 70%, #8dffad);
        box-shadow: 0 0 10px #4fd17a;
        transition: width 0.25s ease-out;
      }
      #boot .boot-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, #ffffff30, transparent);
        transform: translateX(-100%);
        animation: boot-shine 1.6s linear infinite;
      }
      #boot p {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.06em;
        color: #8ea596;
      }
      #boot-pct {
        display: inline-block;
        min-width: 3.2em;
        color: #8dffad;
      }
      @media (min-aspect-ratio: 1/1) {
        #boot img {
          width: min(46vw, 50vh, 320px);
        }
      }
      @keyframes boot-breathe {
        50% {
          filter: drop-shadow(0 0 34px #4fd17a70);
        }
      }
      @keyframes boot-shine {
        to {
          transform: translateX(100%);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <img src="./src/assets/app/logo.webp" alt="Dark Realm" draggable="false" />
      <div class="boot-bar" role="progressbar" aria-label="Загрузка" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="boot-fill"></i></div>
      <p>Пробуждаем покровителей… <span id="boot-pct">0%</span></p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
